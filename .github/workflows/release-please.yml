name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # The shared RELEASE_PLEASE_PAT makes release PRs trigger CI; PRs
          # opened with the built-in GITHUB_TOKEN never trigger workflows.
          # Falls back to github.token until the secret is set.
          token: ${{ secrets.RELEASE_PLEASE_PAT || github.token }}

  attach-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bundle brand kit
        run: |
          tag="${{ needs.release-please.outputs.tag_name }}"
          mkdir -p dist
          zip -r "dist/yolo-brand-kit-${tag}.zip" logos tokens BRANDING.md preview.html LICENSE
          tar -czf "dist/yolo-brand-kit-${tag}.tar.gz" logos tokens BRANDING.md preview.html LICENSE

      - name: Upload bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/* --clobber
